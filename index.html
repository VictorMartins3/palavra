<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Palavra do Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Fraunces:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
/*
VOICE: um jogo de palavras comum até virar o pedido; frio e seco, nada de cartão
IDEA: clone do Termo com número do dia secreto + palavra que se decodifica
PICTURE: o tabuleiro; no fim, o número gigante e depois o loop do rosto dela
COLOUR and TYPE: grafite escuro, verde/amarelo do jogo; Mitr + Fraunces
LAYOUT: coluna única, feito pra celular na mão dela
*/
:root{color-scheme:dark;--bg:#121214;--ink:#f2f2f2;--muted:#8a8a91;--tile:#3a3a3f;--empty:#2a2a2e;--green:#3aa394;--yellow:#d3ad69;--gray:#312a2c;--key:#4c4347}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@supports (height:100dvh){html,body{height:100dvh}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Mitr",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;user-select:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{width:100%;max-width:520px;display:flex;align-items:center;justify-content:center;padding:14px 16px 6px;position:relative}
h1{margin:0;font-weight:600;font-size:30px;letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px;text-align:center;margin-bottom:8px;min-height:18px}
#board{display:grid;gap:6px;padding:8px;margin:auto 0}
.row{display:grid;gap:6px}
.tile{width:var(--t);height:var(--t);border-radius:6px;background:var(--empty);border:2px solid var(--tile);display:grid;place-items:center;font-weight:600;font-size:calc(var(--t)*.55);text-transform:uppercase}
.tile.filled{border-color:#6b6b72;animation:pop .1s}
.tile.green{background:var(--green);border-color:var(--green);color:#fff}
.tile.yellow{background:var(--yellow);border-color:var(--yellow)}
.tile.gray{background:var(--gray);border-color:var(--gray);color:#b7b0b2}
.tile.flip{animation:flip .5s ease}
.tile.dance{animation:dance .5s ease}
.tile.chaos{color:#6d6567}
.row.shake{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes dance{40%{transform:translateY(-14px)}70%{transform:translateY(3px)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#kb{width:100%;max-width:520px;padding:8px 6px 12px;display:grid;gap:7px}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:44px;height:56px;border:0;border-radius:6px;background:var(--key);color:var(--ink);font:600 17px "Mitr",sans-serif;cursor:pointer;display:grid;place-items:center}
.k.wide{max-width:72px;flex:1.6;font-size:13px}
.k.green{background:var(--green)}.k.yellow{background:var(--yellow)}.k.gray{background:#241f20;color:#6d6567}
.k:focus-visible{outline:2px solid #fff}
.k,.tile{touch-action:manipulation;-webkit-user-select:none;-webkit-touch-callout:none}
@media (max-height:620px){.k{height:46px}#kb{gap:5px}header{padding-top:8px}h1{font-size:26px}}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#f2f2f2;color:#121214;padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:16px;z-index:5}
.modal.on{display:grid}
.card{background:#1c1c20;border-radius:14px;padding:24px 22px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h2{margin:0 0 14px;font-size:15px;color:var(--muted);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:18px}
.stats b{display:block;font-size:30px;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.dist{display:grid;gap:4px;margin-bottom:20px;text-align:left}
.bar{display:flex;align-items:center;gap:6px;font-size:13px}
.bar i{font-style:normal;background:#3a3a3f;padding:0 8px;min-width:24px;text-align:right;border-radius:3px}
.bar i.hi{background:var(--green)}
.next{font-size:13px;color:var(--muted)}
.hintbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:-2px}
.hint{background:#1f1f23;border:1px solid var(--tile);border-radius:999px;padding:4px 12px;color:var(--yellow)}
#hint2{display:none}
#timer{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.2em;text-align:center}
#timer.low{color:#e36a6a;animation:pop .5s infinite}
#clock{font-size:34px;font-weight:600;letter-spacing:.05em;font-variant-numeric:tabular-nums}
/* revelação do número */
#reveal{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:8}
#reveal.on{display:flex}
#count{font:600 clamp(80px,28vw,190px)/1 "Mitr",sans-serif;color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:.01em;opacity:0;transform:scale(.6);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.25,1)}
#count.on{opacity:1;transform:none}
#rlabel{margin-top:4px;font-size:13px;color:var(--muted);letter-spacing:.42em;text-transform:uppercase;opacity:0;transition:opacity .7s}
.rblock{margin-top:30px;display:grid;gap:14px;max-width:18em}
.rline{font:400 clamp(18px,5.2vw,25px)/1.4 "Fraunces",serif;color:var(--ink);opacity:0;transform:translateY(10px);transition:opacity 1.1s,transform 1.1s}
.rline.on{opacity:1;transform:none}
/* portão (ele toca antes de entregar) + loop da reação */
.full{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:10}
.full.on{display:flex}
#gate h3{font:400 16px "Mitr",sans-serif;color:var(--muted);margin:0 0 22px;max-width:16em;line-height:1.5}
#gate button{font:600 20px "Mitr",sans-serif;border:0;border-radius:999px;padding:16px 40px;min-height:52px;background:var(--green);color:#fff;cursor:pointer}
#gatehint{margin-top:18px;font-size:12px;color:#55555c;max-width:18em}
#gateerr{display:none;margin-top:16px;font-size:14px;color:#e36a6a;max-width:20em}
#gateskip{display:none;margin-top:14px;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer}
#loopvid{width:100%;max-width:360px;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:#000;transform:scaleX(-1)}
#loopcap{font:italic 400 clamp(18px,5vw,24px)/1.3 "Fraunces",serif;margin:18px 0 20px}
#loop{justify-content:flex-start;overflow-y:auto;padding-top:max(20px,env(safe-area-inset-top))}
#loopvid{max-height:38vh;width:auto;max-width:100%}
#saves{display:grid;gap:8px;width:100%;max-width:400px}
.vrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;text-align:left;font-size:13px;color:var(--muted)}
.vbtn{font:600 13px "Mitr",sans-serif;text-decoration:none;border:1px solid var(--tile);color:var(--ink);border-radius:999px;padding:10px 12px;min-height:44px;display:inline-flex;align-items:center;white-space:nowrap}
.vbtn.wait{opacity:.45;pointer-events:none}
#savestatus{white-space:pre-line;margin-top:14px;font-size:12px;color:var(--muted);max-width:400px;min-height:1.4em}
.saves{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.saves a{display:none;font:600 14px "Mitr",sans-serif;text-decoration:none;border:1px solid var(--tile);color:var(--ink);border-radius:999px;padding:11px 20px;min-height:44px;display:none;align-items:center}
@media (prefers-reduced-motion:reduce){.tile.flip,.tile.dance{animation:none}#count,.rline{transition:opacity .4s}}
</style>
</head>
<body>
<header><h1 id="title">PALAVRA</h1></header>
<div class="sub" id="sub">Nº <span id="num">—</span> · adivinhe em 6 tentativas</div>
<div class="hintbar" id="hintbar"><span class="hint" id="hint1"></span><span class="hint" id="hint2"></span><span id="timer"></span></div>
<div id="board"></div>
<div id="kb"></div>
<div id="toast"></div>

<div class="modal" id="stats"><div class="card">
  <h2>Estatísticas</h2>
  <div class="stats">
    <div><b>1</b><span>jogos</span></div>
    <div><b id="pct">100</b><span>% vitórias</span></div>
    <div><b id="seq">1</b><span>sequência</span></div>
    <div><b id="best">1</b><span>melhor</span></div>
  </div>
  <div class="dist" id="dist"></div>
  <div class="next">palavra bônus liberada em</div>
  <div id="clock">00:00:15</div>
</div></div>

<div id="reveal">
  <div id="count">0</div>
  <div id="rlabel">dias</div>
  <div class="rblock">
    <div class="rline" id="l1"></div>
    <div class="rline" id="l2"></div>
    <div class="rline" id="l3"></div>
  </div>
</div>

<div class="full" id="gate">
  <!-- ELE toca aqui e permite câmera + microfone; depois entrega o celular. Texto neutro de propósito. -->
  <h3>Palavra do dia</h3>
  <button id="gatebtn">▶ jogar</button>
  <div id="gatehint">permita o acesso quando o celular pedir</div>
  <div id="gateerr"></div>
  <button id="gateskip">jogar sem gravar</button>
</div>

<div class="full" id="loop">
  <video id="loopvid" playsinline muted loop autoplay></video>
  <div id="loopcap">e essa foi a sua cara 🥹</div>
  <div id="saves"></div>
  <div id="savestatus"></div>
</div>

<script>
{
// ===================== CONFIGURAÇÃO =====================
const CONFIG = {
  palavra: "PRAIA",          // palavra que ela adivinha (5 letras, sem acento)
  nome: "Leticia",
  dica: "verão ☀️",           // dica que aparece em cima do tabuleiro
  tempo: 150,                // segundos pra adivinhar (2:30); começa na 1ª letra que ela digitar
  dicaExtra: "começa com P", // segunda dica...
  dicaExtraEm: 60,           // ...aparece quando faltar esse tanto de segundos
  contagem: 15,              // segundos da contagem antes do bônus
  bonus: ["VOCÊ","QUER","NAMORAR","COMIGO?"],
  metISO: "2026-06-24",      // dia em que vocês se conheceram (AAAA-MM-DD)
  rev1: "não é o número do jogo.",
  rev2: "são os dias desde 24 de junho — o dia em que te conheci.",
  rev3: "cinco meses exatos, hoje. contei todos.",
  rev3outroDia: "contei todos.",   // usado se não for exatamente 5 meses (24/11)
  cue:  "(pode levantar o olho agora)",
  chaosMs: 2800,             // tempo de caos ilegível antes de travar
  lockStep: 230,             // intervalo entre cada quadrado travar em verde
  loopDelay: 9000,           // espera depois do pedido antes de mostrar o loop
  musica: {
    arquivo: "m.m4a",        // trecho de "Lady (Hear Me Tonight)" — Modjo, do segundo 70 ao 125 da faixa
    inicioArquivo: 70,       // o arquivo começa nesse segundo da música
    entraEm: 73.7,           // vídeos completos: instrumental entra aqui (~quando aparecem as estatísticas)
    noNumero: 89.3,          // segundo da música no instante em que o número aparece
                             // => "I feel love for the first time" quando as letras travam,
                             //    "I can tell by the look in your eyes" quando aparece "(pode levantar o olho agora)"
    volume: 0.5
  },
  drive: "https://script.google.com/macros/s/AKfycbyp_LLUbr36nZVNu4dXERsfGXmolLWCnuzo57i7aWuN53b2x0i5MAmtnE7pplzMpFysUg/exec",                 // URL do Google Apps Script (/exec) pra mandar os vídeos pro Drive. Vazio = não envia.
  gravar: true               // true = tenta gravar a câmera (só em HTTPS/GitHub Pages)
};
// ?teste no fim do link pula direto pra contagem (sem câmera), pra testar.
// ========================================================

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();
const WORD = norm(CONFIG.palavra), N = WORD.length, ROWS = 6;
const GLY = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#@%&?".split("");
const $ = id => document.getElementById(id);
const board = $("board"), kb = $("kb");
let row = 0, col = 0, grid = [], done = false, busy = false;
const keyState = {};

function sizeTiles(cols, rows){
  const w = Math.min(window.innerWidth, 520) - 40;
  const h = window.innerHeight - (window.innerHeight < 620 ? 330 : 365);
  const t = Math.floor(Math.max(26, Math.min(62, (w - (cols-1)*6)/cols, (h - (rows-1)*6)/rows)));
  board.style.setProperty("--t", t+"px");
}
function buildBoard(){
  sizeTiles(N, ROWS);
  board.innerHTML = Array.from({length:ROWS},()=>`<div class="row" style="grid-template-columns:repeat(${N},auto)">${'<div class="tile"></div>'.repeat(N)}</div>`).join("");
  grid = [...board.children].map(r => [...r.children]);
}
const LAYOUT = ["QWERTYUIOP","ASDFGHJKL","⌫ZXCVBNM↵"];
function buildKb(){
  kb.innerHTML = LAYOUT.map(r => `<div class="kr">${[...r].map(c=>{
    if(c==="↵") return `<button class="k wide" data-k="ENTER">ENTER</button>`;
    if(c==="⌫") return `<button class="k wide" data-k="BACK" aria-label="apagar">⌫</button>`;
    return `<button class="k" data-k="${c}">${c}</button>`;
  }).join("")}</div>`).join("");
}
function toast(msg, ms=1400){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("on"), ms);
}
let left = CONFIG.tempo, timerIv = null;
const mmss = v => Math.floor(v/60) + ":" + String(v%60).padStart(2,"0");
function initHints(){
  $("hint1").textContent = "dica: " + CONFIG.dica;
  $("hint2").textContent = CONFIG.dicaExtra;
  $("timer").textContent = "⏱ " + mmss(left);
}
function startTimer(){
  if(timerIv || done) return;
  timerIv = setInterval(()=>{
    if(done){ stopTimer(); return; }
    if(left > 0) left--;
    $("timer").textContent = "⏱ " + mmss(left);
    if(left === CONFIG.dicaExtraEm){ $("hint2").style.display = "inline"; toast("Dica extra: " + CONFIG.dicaExtra, 2000); }
    $("timer").classList.toggle("low", left <= 15);
    if(left <= 0 && !busy) timeUp();   // se uma linha estiver virando, espera ela terminar
  }, 1000);
}
function stopTimer(){ clearInterval(timerIv); $("timer").classList.remove("low"); }
function timeUp(){
  done = true; stopTimer();
  toast("Tempo esgotado! Era " + WORD, 2600);
  setTimeout(()=>showStats(false), 2800);
}
function press(k){
  if(done || busy) return;
  startTimer(); if(!wl) keepAwake();
  if(k==="ENTER") return submit();
  if(k==="BACK"){ if(col>0){ col--; const t=grid[row][col]; t.textContent=""; t.classList.remove("filled"); } return; }
  if(/^[A-Z]$/.test(k) && col<N){ const t=grid[row][col]; t.textContent=k; t.classList.add("filled"); col++; }
}
function score(guess){
  const res = Array(N).fill("gray"), left = {};
  for(let i=0;i<N;i++){ if(guess[i]===WORD[i]) res[i]="green"; else left[WORD[i]]=(left[WORD[i]]||0)+1; }
  for(let i=0;i<N;i++){ if(res[i]!=="green" && left[guess[i]]){ res[i]="yellow"; left[guess[i]]--; } }
  return res;
}
const RANK = {gray:1,yellow:2,green:3};
function paintKey(ch, st){
  if((RANK[keyState[ch]]||0) >= RANK[st]) return;
  keyState[ch] = st;
  const b = kb.querySelector(`[data-k="${ch}"]`); if(b){ b.classList.remove("gray","yellow","green"); b.classList.add(st); }
}
function submit(){
  if(col<N){ board.children[row].classList.add("shake"); setTimeout(()=>board.children[row].classList.remove("shake"),400); toast("Letras insuficientes"); return; }
  const guess = grid[row].map(t=>t.textContent).join("");
  const res = score(guess); busy = true;
  grid[row].forEach((t,i)=>{
    setTimeout(()=>{ t.classList.add("flip"); setTimeout(()=>{ t.classList.add(res[i]); paintKey(guess[i],res[i]); },250); }, i*280);
  });
  const end = N*280 + 350;
  setTimeout(()=>{
    busy = false;
    if(guess===WORD){
      done = true; stopTimer();
      toast(["Genial!","Magnífico!","Impressionante!","Extraordinário!","Fenomenal!","Ufa!"][row], 1800);
      grid[row].forEach((t,i)=>setTimeout(()=>t.classList.add("dance"), i*100));
      setTimeout(()=>showStats(true), 2200);
    } else if(row===ROWS-1){
      done = true; stopTimer(); toast(WORD, 2500); setTimeout(()=>showStats(false), 2600);
    } else { row++; col=0; if(left <= 0 && timerIv) timeUp(); }
  }, end);
}
function showStats(win){
  $("pct").textContent = win ? 100 : 0;
  $("seq").textContent = win ? 1 : 0;
  $("best").textContent = win ? 1 : 0;
  $("dist").innerHTML = [1,2,3,4,5,6].map(n=>{
    const hit = win && n===row+1;
    return `<div class="bar">${n}<i class="${hit?'hi':''}" style="width:${hit?100:8}%">${hit?1:0}</i></div>`;
  }).join("");
  $("stats").classList.add("on");
  let s = CONFIG.contagem;
  const fmt = v => "00:00:" + String(v).padStart(2,"0");
  $("clock").textContent = fmt(s);
  const iv = setInterval(()=>{
    s--; $("clock").textContent = fmt(Math.max(s,0));
    if(s<=0){ clearInterval(iv); setTimeout(showNumber, 600); }
  }, 1000);
}

// ---------- revelação do número ----------
function daysSince(iso){
  const p = iso.split("-").map(Number);
  const start = new Date(p[0], p[1]-1, p[2]);
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((today - start)/86400000));
}
let DAYS = daysSince(CONFIG.metISO);
$("num").textContent = DAYS;

function showNumber(){
  DAYS = daysSince(CONFIG.metISO);   // caso a página tenha sido aberta no dia anterior
  const p = CONFIG.metISO.split("-").map(Number), now = new Date();
  const mesesExatos = now.getDate() === p[2] && ((now.getFullYear()-p[0])*12 + now.getMonth()-(p[1]-1)) === 5;
  if(!mesesExatos) CONFIG.rev3 = CONFIG.rev3outroDia;
  $("stats").classList.remove("on");
  tReveal = performance.now();
  startClipB();                 // começa a gravar a reação a partir daqui
  const cEl = $("count");
  $("reveal").classList.add("on");
  setTimeout(()=>{
    cEl.classList.add("on");
    let t0 = null; const dur = 2400;
    const step = ts => {
      if(!t0) t0 = ts;
      const p = Math.min((ts - t0)/dur, 1), e = 1 - Math.pow(1-p, 3);
      cEl.textContent = Math.round(e * DAYS);
      if(p < 1) requestAnimationFrame(step);
      else { cEl.textContent = DAYS; $("rlabel").style.opacity = 1; lines(); }
    };
    requestAnimationFrame(step);
  }, 600);
  function lines(){
    [["l1",CONFIG.rev1,900],["l2",CONFIG.rev2,2700],["l3",CONFIG.rev3,5200]]
      .forEach(a => setTimeout(()=>{ $(a[0]).textContent = a[1]; $(a[0]).classList.add("on"); }, a[2]));
    setTimeout(startProposal, 8200);
  }
}

// ---------- a palavra bônus: caos ilegível -> trava em verde fora de ordem ----------
function startProposal(){
  const rv = $("reveal");
  rv.style.transition = "opacity 1s"; rv.style.opacity = 0;
  setTimeout(()=>{ rv.classList.remove("on"); rv.style.opacity = ""; rv.style.transition = ""; }, 1000);
  kb.style.transition = "opacity .6s"; kb.style.opacity = 0;
  $("title").textContent = "PALAVRA BÔNUS";
  $("hintbar").style.display = "none";
  $("sub").textContent = "esta é especial…";
  const words = CONFIG.bonus.map(w => [...w.toUpperCase()]);
  const maxLen = Math.max(...words.map(w => w.length));
  sizeTiles(maxLen, words.length);
  board.style.justifyItems = "center";
  board.innerHTML = words.map(w => `<div class="row" style="grid-template-columns:repeat(${w.length},auto)">${'<div class="tile"></div>'.repeat(w.length)}</div>`).join("");
  const rowsEl = [...board.children].map(r => [...r.children]);
  const flat = [];
  rowsEl.forEach((tiles, ri) => tiles.forEach((el, ci) => flat.push({ el, char: words[ri][ci] })));
  const timers = new Map();
  const rnd = () => GLY[Math.floor(Math.random()*GLY.length)];

  // 1) CAOS: cada quadrado pisca símbolos aleatórios, ilegível
  setTimeout(()=>{
    flat.forEach(f=>{
      f.el.classList.add("filled","chaos");
      f.el.textContent = rnd();
      const id = setInterval(()=>{ f.el.textContent = rnd(); }, 60 + Math.random()*70);
      timers.set(f.el, id);
    });
    setTimeout(lock, CONFIG.chaosMs);
  }, 1100);

  // 2) TRAVA: em ordem totalmente aleatória pela tela inteira
  function lock(){
    const order = flat.slice();
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    let k = 0;
    const lockNext = () => {
      if(k >= order.length){ setTimeout(endCue, 1000); return; }
      const f = order[k++];
      clearInterval(timers.get(f.el));
      f.el.classList.remove("chaos");
      f.el.classList.add("flip");
      setTimeout(()=>{ f.el.textContent = f.char; f.el.classList.add("green"); }, 240);
      setTimeout(lockNext, CONFIG.lockStep);
    };
    lockNext();
  }
}

function endCue(){
  const sub = $("sub");
  sub.style.transition = "opacity .8s"; sub.style.opacity = 0;
  setTimeout(()=>{ sub.textContent = CONFIG.cue; sub.style.color = "var(--green)"; sub.style.opacity = 1; }, 800);
  // depois de um tempo pro "sim" acontecer, encerra e mostra o loop da reação
  setTimeout(()=> stopAll(showLoop), CONFIG.loopDelay);
}

// ====================== GRAVAÇÃO ======================
// recC = vídeo COMPLETO (do "começar" até o fim do pedido): tela à esquerda + rosto à direita, com áudio.
// recB = só a REAÇÃO: câmera pura, da revelação do número até o fim (vira o loop).
// recI = INSTAGRAM 9:16, 30s: rosto em cima + tela embaixo, da revelação do número em diante.
let tReveal = 0, recF=null, chunksF=[];
let camStream=null, camVid=null, recB=null, recC=null, recI=null, chunksB=[], chunksC=[], chunksI=[], recType="video/webm", drawing=false;
function pickMime(){
  const c=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  if(window.MediaRecorder && MediaRecorder.isTypeSupported)
    for(const m of c){ if(MediaRecorder.isTypeSupported(m)) return m; }
  return "";
}
const EXT = () => recType.includes("mp4") ? "mp4" : "webm";
let recErr = "";
function newRec(stream, chunks, vbps=2500000){
  const m = pickMime(), opt = { videoBitsPerSecond:vbps, audioBitsPerSecond:128000 };
  if(m) opt.mimeType = m;
  let r;
  try{ r = new MediaRecorder(stream, opt); }
  catch(e){ r = new MediaRecorder(stream, m ? { mimeType:m } : undefined); } // alguns aparelhos recusam bitrate
  recType = r.mimeType || m || "video/webm";
  r.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  r._t0 = performance.now(); r.addEventListener("stop", ()=>{ r._t1 = performance.now(); });
  r.start(); // sem fatias: no iPhone, gravar em pedaços gera MP4 sem duração (vira "ao vivo")
  return r;
}
async function startCamera(){
  if(!CONFIG.gravar || !navigator.mediaDevices || !window.MediaRecorder) return false;
  const v = { facingMode:"user", width:{ideal:720}, height:{ideal:960} };
  try{ camStream = await navigator.mediaDevices.getUserMedia({ video:v, audio:true }); }
  catch(e){ // microfone negado? grava pelo menos o vídeo
    try{ camStream = await navigator.mediaDevices.getUserMedia({ video:v }); }catch(e2){ camStream = null; recErr = e2.name + ": " + e2.message; return false; }
  }
  camVid = document.createElement("video");
  camVid.muted = true; camVid.playsInline = true; camVid.setAttribute("playsinline","");
  camVid.srcObject = camStream;
  camVid.style.cssText = "position:fixed;left:0;top:0;width:4px;height:4px;opacity:.02;pointer-events:none";
  document.body.appendChild(camVid);
  try{ await camVid.play(); }catch(e){}
  startComposite();
  return true;
}

// ---------- compositor: redesenha a tela num canvas e junta com o rosto ----------
const LW = 1280, LH = 720, LHALF = 640;           // completo: lado a lado
const IW = 720, IH = 1280, IFACE = 560;           // instagram: rosto em cima (560), tela embaixo (720)
const IG_MS = 30000;
let extraTracks = [];
let cxL = null, cxI = null, ops = [], bodyBg = "#121214", lastPaint = 0;
function mkCanvas(w,h){ const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function canvasRec(cv, chunks, vbps){
  try{
    const out = cv.captureStream(30);
    camStream.getAudioTracks().forEach(t => { const c = t.clone(); extraTracks.push(c); out.addTrack(c); });
    return newRec(out, chunks, vbps);
  }catch(e){ recErr = e.name + ": " + e.message; return null; }
}
function startComposite(){
  const cv = mkCanvas(LW, LH);
  if(!cv.captureStream){ try{ recC = newRec(camStream, chunksC); }catch(e){} return; } // sem canvas: só câmera
  cxL = cv.getContext("2d");
  try{ snapshot(); paintL(); }catch(e){}   // primeiro frame já desenhado (evita início preto)
  const cvI = mkCanvas(IW, IH); cxI = cvI.getContext("2d");
  try{ paintI(); }catch(e){}
  drawing = true; requestAnimationFrame(frame);
  recC = canvasRec(cv, chunksC);
  recF = canvasRec(cvI, chunksF, 3000000);   // completo em formato Instagram (9:16)
  if(!recC){ try{ recC = newRec(camStream, chunksC); }catch(e){} }
}
function startClipB(){ // chamado quando o número aparece
  if(!camStream || !window.MediaRecorder) return;
  try{ recB = newRec(camStream, chunksB, 3000000); }catch(e){ recB = null; recErr = e.name; }
  if(drawing && cxI){
    recI = canvasRec(cxI.canvas, chunksI, 3000000);
    setTimeout(()=>{ if(recI && recI.state !== "inactive") try{ recI.stop(); }catch(e){} }, IG_MS);
  }
}
function frame(ts){
  if(!drawing) return;
  if(ts - lastPaint > 30){
    lastPaint = ts;
    try{
      snapshot();
      paintL();
      if(cxI) paintI();
    }catch(e){}
  }
  requestAnimationFrame(frame);
}
function rr(c,x,y,w,h,r){
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function drawScreen(c, x, y, w, h, s, ox, oy){
  c.save();
  c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.fillStyle = bodyBg; c.fillRect(x,y,w,h);
  c.setTransform(s,0,0,s,ox,oy);
  for(const o of ops) (o.t==="b" ? drawBox : drawText)(c, o);
  c.restore();
}
function drawFace(c, x, y, w, h){
  if(!camVid || !camVid.videoWidth) return;
  const vw = camVid.videoWidth, vh = camVid.videoHeight, sc = Math.max(w/vw, h/vh);
  c.save();
  c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.translate(x + w/2, y + h/2); c.scale(-1,1);
  c.drawImage(camVid, -vw*sc/2, -vh*sc/2, vw*sc, vh*sc);
  c.restore();
}
function paintL(){
  const c = cxL, W = innerWidth, H = innerHeight, s = Math.min(LHALF/W, LH/H);
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = "#000"; c.fillRect(0,0,LW,LH);
  drawScreen(c, 0, 0, LHALF, LH, s, (LHALF - W*s)/2, (LH - H*s)/2);
  drawFace(c, LHALF, 0, LHALF, LH);
}
function paintI(){
  // na revelação e no pedido o teclado some, então mostra só a parte de cima da tela (onde está tudo), maior
  const c = cxI, W = innerWidth, H = innerHeight, area = IH - IFACE;
  const Hw = Math.min(H, 660), s = Math.min(IW/W, area/Hw);
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = bodyBg; c.fillRect(0,0,IW,IH);
  drawFace(c, 0, 0, IW, IFACE);
  drawScreen(c, 0, IFACE, IW, area, s, (IW - W*s)/2, IFACE + (area - Hw*s)/2);
  c.fillStyle = "rgba(255,255,255,.12)"; c.fillRect(0, IFACE, IW, 2);
}

// lê a página e monta a lista do que desenhar (uma vez por frame, usada nos dois vídeos)
const SKIP = new Set(["SCRIPT","STYLE","VIDEO","CANVAS","LINK","META"]);
function snapshot(){
  ops = []; bodyBg = getComputedStyle(document.body).backgroundColor;
  walk(document.body, 1);
}
function walk(el, op){
  if(SKIP.has(el.tagName) || el.id==="gate" || el.id==="loop") return;
  const cs = getComputedStyle(el);
  if(cs.display==="none" || cs.visibility==="hidden") return;
  op *= parseFloat(cs.opacity);
  if(op < .01) return;
  if(el !== document.body) box(el, cs, op);
  for(const n of el.childNodes){
    if(n.nodeType===1) walk(n, op);
    else if(n.nodeType===3 && n.textContent.trim()) text(n, cs, op);
  }
}
function box(el, cs, op){
  const bg = cs.backgroundColor, bw = parseFloat(cs.borderTopWidth) || 0;
  const hasBg = bg && bg!=="transparent" && !/,\s*0\)$/.test(bg);
  if(!hasBg && !bw) return;
  const r = el.getBoundingClientRect(); if(r.width<1 || r.height<1) return;
  const rad = Math.max(0, Math.min(parseFloat(cs.borderTopLeftRadius)||0, r.width/2, r.height/2));
  ops.push({ t:"b", x:r.left, y:r.top, w:r.width, h:r.height, rad, bg: hasBg ? bg : null, bw, bc: cs.borderTopColor, op });
}
function drawBox(c, o){
  c.globalAlpha = o.op;
  if(o.bg){ c.beginPath(); rr(c,o.x,o.y,o.w,o.h,o.rad); c.fillStyle = o.bg; c.fill(); }
  if(o.bw){
    c.beginPath(); rr(c, o.x+o.bw/2, o.y+o.bw/2, o.w-o.bw, o.h-o.bw, Math.max(0,o.rad-o.bw/2));
    c.lineWidth = o.bw; c.strokeStyle = o.bc; c.stroke();
  }
  c.globalAlpha = 1;
}
function wrap(str, n, maxW){
  const words = str.split(" "), lines = []; let cur = "";
  for(const w of words){
    const t = cur ? cur+" "+w : w;
    if(cur && cxL.measureText(t).width > maxW+1 && lines.length < n-1){ lines.push(cur); cur = w; } else cur = t;
  }
  lines.push(cur); return lines;
}
function text(node, cs, op){
  const range = document.createRange(); range.selectNodeContents(node);
  const rects = [...range.getClientRects()].filter(r => r.width > 0);
  if(!rects.length) return;
  const el = node.parentElement, er = el.getBoundingClientRect();
  const kx = el.offsetWidth ? er.width/el.offsetWidth : 1, ky = el.offsetHeight ? er.height/el.offsetHeight : 1;
  if(ky < .05 || kx < .05) return;   // quadrado no meio do flip
  const font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const ls = cs.letterSpacing==="normal" ? "0px" : cs.letterSpacing;
  let str = node.textContent.replace(/\s+/g," ").trim();
  if(cs.textTransform==="uppercase") str = str.toUpperCase();
  let lines = [str];
  if(rects.length > 1){
    cxL.font = font; if("letterSpacing" in cxL) cxL.letterSpacing = ls;
    lines = wrap(str, rects.length, Math.max(...rects.map(r=>r.width))/kx);
  }
  ops.push({ t:"x", font, ls, color: cs.color, op, kx, ky,
    lines: rects.map((r,i) => ({ x: r.left + r.width/2, y: r.top + r.height/2, s: lines[i] || "" })) });
}
function drawText(c, o){
  c.font = o.font; if("letterSpacing" in c) c.letterSpacing = o.ls;
  c.fillStyle = o.color; c.globalAlpha = o.op; c.textBaseline = "middle"; c.textAlign = "center";
  for(const l of o.lines){
    if(!l.s) continue;
    c.save(); c.translate(l.x, l.y); c.scale(o.kx, o.ky); c.fillText(l.s, 0, 0); c.restore();
  }
  c.globalAlpha = 1;
}

function stopAll(cb){
  let pending = 0, called = false;
  const finish = () => {
    if(called) return; called = true;
    drawing = false;
    try{ camStream && camStream.getTracks().forEach(t=>t.stop()); }catch(e){}
    extraTracks.forEach(t => { try{ t.stop(); }catch(e){} });
    cb();
  };
  const fin = () => { if(--pending <= 0) finish(); };
  [recB, recC, recI, recF].forEach(r => {
    if(r && r.state !== "inactive"){ pending++; r.onstop = fin; r.onerror = fin; try{ r.stop(); }catch(e){ fin(); } }
  });
  if(pending === 0) finish();
  setTimeout(finish, 5000);   // se algum gravador travar, a tela final aparece mesmo assim
}
// ====================== SALVAR: celular (IndexedDB) + Google Drive + versões com música ======================
const sleep = ms => new Promise(r => setTimeout(r, ms));
const VIDS = [ // ordem = ordem de envio pro Drive (menores primeiro)
  { key:"B", label:"Só a reação",            name:"reacao",                    chunks:()=>chunksB, rec:()=>recB },
  { key:"I", label:"Instagram 30s",           name:"pedido-instagram-30s",      chunks:()=>chunksI, rec:()=>recI },
  { key:"F", label:"Completo · Instagram",    name:"pedido-completo-instagram", chunks:()=>chunksF, rec:()=>recF },
  { key:"C", label:"Completo (lado a lado)",  name:"pedido-completo",           chunks:()=>chunksC, rec:()=>recC },
];

// ---------- IndexedDB: guarda cada vídeo no próprio celular assim que fica pronto ----------
function idb(){
  return new Promise((ok, no) => {
    const q = indexedDB.open("pedido-videos", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("v");
    q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error);
  });
}
async function idbPut(file){
  try{ const db = await idb(); await new Promise((ok,no)=>{ const t = db.transaction("v","readwrite"); t.objectStore("v").put(file, file.name); t.oncomplete = ok; t.onerror = ()=>no(t.error); }); return true; }
  catch(e){ return false; }
}
async function idbAll(){
  try{ const db = await idb(); return await new Promise((ok,no)=>{ const out = []; const t = db.transaction("v"); const c = t.objectStore("v").openCursor();
    c.onsuccess = () => { const k = c.result; if(k){ out.push(k.value); k.continue(); } else ok(out); }; c.onerror = ()=>no(c.error); }); }
  catch(e){ return []; }
}

// ---------- Google Drive (via Google Apps Script do próprio usuário; ver CONFIG.drive) ----------
function blobToB64(b){ return new Promise((ok,no)=>{ const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => no(r.error); r.readAsDataURL(b); }); }
async function drivePost(obj){
  const r = await fetch(CONFIG.drive, { method:"POST", body: JSON.stringify(obj) }); // text/plain: sem preflight CORS
  const j = await r.json(); if(!j.ok) throw new Error(j.error || "drive"); return j;
}
async function driveUpload(file, onProg){
  const s = await drivePost({ a:"start", name:file.name, mime:file.type || "video/mp4", size:file.size });
  const CH = 8*1024*1024; let off = 0;
  while(off < file.size){
    const end = Math.min(off + CH, file.size), data = await blobToB64(file.slice(off, end));
    for(let tries = 1; ; tries++){
      try{ await drivePost({ a:"chunk", url:s.url, start:off, end:end-1, total:file.size, data }); break; }
      catch(e){ if(tries >= 5) throw e; await sleep(2500*tries); }
    }
    off = end; onProg && onProg(off / file.size);
  }
}
const upQueue = []; let upWorkers = 0, upDone = 0, upFail = 0; const upCur = {};
function queueUpload(file){
  if(!CONFIG.drive) return;
  upQueue.push(file);
  while(upWorkers < 3 && upQueue.length) uploadWorker();   // 3 vídeos ao mesmo tempo (o Apps Script é lento)
}
async function uploadWorker(){
  upWorkers++;
  while(upQueue.length){
    const f = upQueue.shift();
    let ok = false;
    for(let round = 1; round <= 3 && !ok; round++){
      try{ await driveUpload(f, p => { upCur[f.name] = Math.round(p*100) + "%"; status(); }); ok = true; }
      catch(e){ upCur[f.name] = "erro, tentando de novo"; status(); await sleep(5000*round); }
    }
    delete upCur[f.name]; ok ? upDone++ : upFail++; status();
  }
  upWorkers--; status();
}

// ---------- música (ffmpeg.wasm: junta o áudio sem regravar a imagem) ----------
let ffCore = null;
async function loadFF(){
  if(ffCore) return ffCore;
  await new Promise((ok,no)=>{ const s = document.createElement("script"); s.src = "ff/ffmpeg-core.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  ffCore = await createFFmpegCore({ locateFile: p => "ff/" + p });
  const mus = new Uint8Array(await (await fetch(CONFIG.musica.arquivo)).arrayBuffer());
  ffCore.FS.writeFile("musica.m4a", mus);
  return ffCore;
}
async function addMusic(v){
  const M = CONFIG.musica, core = await loadFF();
  const r = v.rec, ext = v.file.name.split(".").pop(), inN = "in." + ext, outN = "out." + ext;
  const dur = Math.max(1, ((r && r._t1 || performance.now()) - (r && r._t0 || 0)) / 1000);
  // em que segundo do vídeo a música deve começar (pode ser antes do vídeo começar)
  const dv = (tReveal - (r && r._t0 || tReveal)) / 1000 - (M.noNumero - M.entraEm);
  let P, D, FI;
  if(dv >= 0){ P = M.entraEm - M.inicioArquivo; D = Math.round(dv*1000); FI = 3; }   // vídeo completo: entra no instrumental
  else       { P = M.entraEm - M.inicioArquivo - dv; D = 0; FI = 1.5; }              // clipes curtos: já começa no ponto certo
  const OUT = Math.max(0, dur - 2.5).toFixed(2);
  const mus = `[1:a]atrim=start=${P.toFixed(2)},asetpts=PTS-STARTPTS,afade=t=in:st=0:d=${FI},volume=${M.volume},adelay=${D}|${D}`;
  const temVoz = !!(camStream && camStream.getAudioTracks().length);
  const fc = temVoz
    ? `${mus}[m];[0:a][m]amix=inputs=2:duration=first:dropout_transition=0:normalize=0,afade=t=out:st=${OUT}:d=2.5[a]`
    : `${mus},apad,afade=t=out:st=${OUT}:d=2.5[a]`;
  core.FS.writeFile(inN, new Uint8Array(await v.file.arrayBuffer()));
  const args = ["-i", inN, "-i", "musica.m4a", "-filter_complex", fc, "-map", "0:v", "-map", "[a]", "-c:v", "copy"];
  if(ext === "mp4") args.push("-c:a", "aac", "-b:a", "160k", "-movflags", "+faststart");
  else args.push("-c:a", "libopus", "-b:a", "128k");
  if(!temVoz) args.push("-t", dur.toFixed(2));
  args.push(outN);
  const ret = core.exec(...args);
  let data = null; try{ data = core.FS.readFile(outN); }catch(e){}
  try{ core.FS.unlink(inN); }catch(e){} try{ core.FS.unlink(outN); }catch(e){}
  try{ core.reset(); }catch(e){}
  if(ret !== 0 || !data || data.length < 1000) throw new Error("ffmpeg " + ret);
  return new File([data], v.name + "-com-musica." + ext, { type: v.file.type });
}

// ---------- tela final ----------
let savedLocal = 0, savedTotal = 0;
function status(){
  const parts = [];
  if(savedTotal) parts.push((savedLocal === savedTotal ? "✓" : "…") + " salvos no celular: " + savedLocal + "/" + savedTotal);
  if(CONFIG.drive){
    const going = Object.entries(upCur).map(([n,p]) => n.replace(/\.(mp4|webm)$/,"") + " " + p);
    const pend = going.length + upQueue.length;
    parts.push("☁️ Drive: " + upDone + " enviados" + (upFail ? ", " + upFail + " falharam" : "") + (pend ? " · enviando " + pend + " (não feche a página)" : " ✓") + (going.length ? "\n" + going.join(" · ") : ""));
  }
  $("savestatus").textContent = parts.join("   ·   ");
}
function shareBtn(btn, file, label){
  const url = URL.createObjectURL(file);
  btn.textContent = label; btn.href = url; btn.download = file.name; btn.classList.remove("wait");
  btn.onclick = ev => {
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      ev.preventDefault(); navigator.share({ files:[file] }).catch(()=>{});
    }
  };
  return url;
}
function rowEl(label){
  const row = document.createElement("div"); row.className = "vrow";
  row.innerHTML = `<span>${label}</span><a class="vbtn wait">…</a><a class="vbtn wait">🎵 preparando…</a>`;
  $("saves").appendChild(row);
  return row.querySelectorAll("a");
}
async function showLoop(){
  const vids = [];
  for(const v of VIDS){
    const ch = v.chunks(); if(!ch.length) continue;
    const r = v.rec(), type = (r && r.mimeType) || recType || "video/mp4";
    v.file = new File([new Blob(ch, { type })], v.name + (type.includes("mp4") ? ".mp4" : ".webm"), { type });
    v.rec = r; vids.push(v);
  }
  if(!vids.length) return; // sem gravação (ex: no artifact): o pedido já foi o fim
  savedTotal = vids.length * 2;
  for(const v of vids){
    const [b1, b2] = rowEl(v.label); v.b2 = b2;
    const url = shareBtn(b1, v.file, "⬇ sem música");
    if(v.key === "B"){ const lv = $("loopvid"); lv.src = url; lv.play().catch(()=>{}); }
  }
  $("loop").classList.add("on"); status();
  // 1) guarda tudo no celular, 2) manda pro Drive, 3) gera as versões com música (e guarda/manda também)
  for(const v of vids){ if(await idbPut(v.file)) savedLocal++; status(); queueUpload(v.file); }
  for(const v of vids){
    try{
      await sleep(50);
      const fm = await addMusic(v);
      shareBtn(v.b2, fm, "🎵 com música");
      if(await idbPut(fm)) savedLocal++; status(); queueUpload(fm);
    }catch(e){ v.b2.textContent = "🎵 indisponível"; savedTotal--; status(); }
  }
}

// ---------- ?videos : recupera os vídeos salvos no celular ----------

    if(CONFIG.drive) b2.onclick = () => { b2.textContent = "na fila…"; queueUpload(f); }; else b2.style.display = "none";
  }
  $("loop").classList.add("on"); status();
}

// ====================== TELA SEMPRE ACESA ======================
let wl = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator && !wl && document.visibilityState === "visible"){ wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", ()=>{ wl = null; }); } }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){ keepAwake(); if(camVid) camVid.play().catch(()=>{}); }
});

// ====================== SEM ZOOM (pinça / toque duplo) ======================
["gesturestart","gesturechange","gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
document.addEventListener("touchmove", e => { if(e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive:false });
let lastTouch = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if(now - lastTouch < 350 && !e.target.closest("a")){ e.preventDefault(); const k = e.target.closest("[data-k]"); if(k) press(k.dataset.k); }
  lastTouch = now;
}, { passive:false });
document.addEventListener("dblclick", e => e.preventDefault(), { passive:false });

// ====================== EVENTOS / INÍCIO ======================
kb.addEventListener("click", e=>{ const b=e.target.closest("[data-k]"); if(b){ press(b.dataset.k); b.blur(); } });
document.addEventListener("keydown", e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;
  if(e.key==="Enter"){ e.preventDefault(); press("ENTER"); }
  else if(e.key==="Backspace") press("BACK");
  else { const k = norm(e.key); if(/^[A-Z]$/.test(k)) press(k); }
});
window.addEventListener("resize", ()=>{ if(!done) sizeTiles(N, ROWS); });

buildBoard(); buildKb(); initHints();

const TESTE = location.search.includes("teste") || location.hash==="#teste";
const ENSAIO = location.search.includes("ensaio");
if(location.search.includes("videos")){ done = true; showSaved(); }
else if(TESTE){ done = true; showStats(true); }
else {
  // portão: ELE toca "jogar", libera câmera + microfone, confere que está gravando, e só então entrega o celular
  $("gate").classList.add("on");
  let starting = false;
  const begin = () => {
    $("gate").classList.remove("on");
    keepAwake();
    try{ history.pushState(null, "", location.href); addEventListener("popstate", ()=>history.pushState(null, "", location.href)); }catch(e){}
    if(ENSAIO){ done = true; showStats(true); } // ?ensaio = testa a gravação pulando o jogo
  };
  $("gatebtn").addEventListener("click", async ()=>{
    if(starting) return; starting = true;
    fetch("ff/ffmpeg-core.wasm").then(r=>r.blob()).catch(()=>{});   // pré-carrega o mixador de música
    keepAwake();
    let ok = false;
    try{ ok = await startCamera(); }catch(e){ recErr = e.name + ": " + e.message; }
    const gravando = ok && recC && recC.state === "recording";
    if(gravando || !CONFIG.gravar){
      if(gravando && !camStream.getAudioTracks().length){
        $("gateerr").textContent = "⚠ gravando SEM som (microfone bloqueado). toque em jogar pra seguir assim.";
        $("gateerr").style.display = "block"; $("gatebtn").onclick = begin; return;
      }
      return begin();
    }
    $("gateerr").textContent = "⚠ a gravação não iniciou" + (recErr ? " (" + recErr + ")" : "") +
      ". Confira em Ajustes › Safari › Câmera e Microfone = Permitir, recarregue a página e tente de novo.";
    $("gateerr").style.display = "block";
    $("gateskip").style.display = "inline-block";
    $("gatebtn").textContent = "↻ tentar de novo";
    $("gatebtn").onclick = () => location.reload();
  }, { once:true });
  $("gateskip").addEventListener("click", begin);
}
}
</script>
